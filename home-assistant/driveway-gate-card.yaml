# Full Home Assistant Lovelace Manual card using custom:button-card.
# REPLACE sample entity IDs throughout with the ones on YOUR system.
# Requires HACS custom-cards/button-card. Example lamps are optional.
# Dashboard controls are NOT safety-rated; retain factory gate protections.

type: vertical-stack
cards:
  # -------- Gate visualization --------
  - type: custom:button-card
    entity: sensor.driveway_gaterelaycontroller_gate_position
    name: Driveway Gate
    show_icon: false
    show_state: false
    show_label: true
    triggers_update:
      - sensor.driveway_gaterelaycontroller_gate_position
      - switch.driveway_gaterelaycontroller_gate_party_mode
      - light.hue_white_lamp_1_3
      - light.hue_white_lamp_1_2
    tap_action:
      action: more-info
    hold_action:
      action: none
    double_tap_action:
      action: none
    label: |
      [[[
        const pos = entity?.state;
        const party = states['switch.driveway_gaterelaycontroller_gate_party_mode']?.state === 'on';
        if (party) return 'PARTY MODE ON · ' + String(pos || 'Unknown').toUpperCase();
        if (pos === 'Open') return 'OPEN';
        if (pos === 'Closed') return 'CLOSED LIMIT INDICATED';
        if (pos === 'Between Limits') return 'BETWEEN LIMITS';
        if (pos === 'Invalid State') return 'INVALID LIMIT SIGNALS';
        return 'POSITION UNAVAILABLE';
      ]]]
    custom_fields:
      gate: |
        [[[
          const pos = entity?.state;
          const party = states['switch.driveway_gaterelaycontroller_gate_party_mode']?.state === 'on';
          const leftState = states['light.hue_white_lamp_1_3']?.state;
          const rightState = states['light.hue_white_lamp_1_2']?.state;
          const leftOn = leftState === 'on';
          const rightOn = rightState === 'on';

          // Only the limit contacts are known; this is symbolic, not angle telemetry.
          const p = pos === 'Open' ? 1 : pos === 'Between Limits' ? 0.55 : 0;
          const leftEnd = 199 - p * 99;
          const rightStart = 201 + p * 99;
          const metal = '#aab8c7';
          const statusColor = party ? '#fbbf24' :
            pos === 'Closed' ? '#4ade80' :
            pos === 'Open' ? '#60a5fa' :
            pos === 'Between Limits' ? '#fb923c' : '#94a3b8';

          // Stylized arched double gate with upright pickets and spear tips.
          const pickets = (start, end, highAtEnd) => {
            return Array.from({length: 10}, (_, i) => {
              const t = (i + 1) / 11;
              const x = start + (end - start) * t;
              const top = highAtEnd ? 110 - 23*t*t : 87 + 23*t*t;
              return `<line x1="${x}" y1="${top}" x2="${x}" y2="174"
                        stroke="${metal}" stroke-width="2.5"/>
                      <path d="M${x-3} ${top} L${x} ${top-10} L${x+3} ${top}Z"
                        fill="${metal}"/>`;
            }).join('');
          };
          const lamp = (x, on) => `
            ${on ? `<circle cx="${x}" cy="68" r="25" fill="#ffca64"
              opacity="0.35" filter="url(#poleLampGlow)"/>` : ''}
            <path d="M${x-8} 62 L${x} 51 L${x+8} 62 V82 H${x-8} Z"
              fill="${on ? '#ffdb83' : '#69798c'}"
              stroke="#a9b8c9" stroke-width="2"/>
            <path d="M${x-11} 62 H${x+11} M${x-6} 51 H${x+6}"
              stroke="#a9b8c9" stroke-width="2"/>`;

          return `
            <svg viewBox="0 0 400 220" width="100%" height="180"
                 preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
              <defs>
                <linearGradient id="driveGateSky" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0" stop-color="#24394d"/>
                  <stop offset="1" stop-color="#425a69"/>
                </linearGradient>
                <filter id="poleLampGlow"><feGaussianBlur stdDeviation="8"/></filter>
              </defs>
              <rect width="400" height="220" rx="12" fill="url(#driveGateSky)"/>
              <path d="M0 115 Q60 73 110 114 Q157 83 200 112
                       Q258 75 300 113 Q355 78 400 118 V182 H0Z" fill="#2d4b43"/>
              <path d="M110 162 H290 L400 220 H0Z" fill="#354658"/>
              <path d="M0 116 H48 M0 158 H48 M352 116 H400 M352 158 H400"
                    stroke="#9cabb9" stroke-width="3" fill="none"/>
              <rect x="38" y="84" width="15" height="111" fill="#182636"/>
              <rect x="347" y="84" width="15" height="111" fill="#182636"/>
              ${lamp(46, leftOn)}
              ${lamp(354, rightOn)}
              <path d="M52 110 Q${(52+leftEnd)/2} 109 ${leftEnd} 86
                       L${leftEnd} 174 H52Z"
                    stroke="${metal}" stroke-width="4" fill="#142433" fill-opacity=".20"/>
              ${pickets(52, leftEnd, true)}
              <path d="M${rightStart} 86 Q${(rightStart+348)/2} 109 348 110
                       V174 H${rightStart}Z"
                    stroke="${metal}" stroke-width="4" fill="#142433" fill-opacity=".20"/>
              ${pickets(rightStart, 348, false)}
              <path d="M52 144 H${leftEnd} M${rightStart} 144 H348"
                    stroke="${metal}" stroke-width="4"/>
              <path d="M52 172 L${52+(leftEnd-52)*.27} 168
                       M348 172 L${348-(348-rightStart)*.27} 168"
                    stroke="#8798a9" stroke-width="5"/>
              <circle cx="378" cy="24" r="7" fill="${statusColor}"/>
              <rect y="195" width="400" height="25" fill="#142434" opacity="0.6"/>
            </svg>`;
        ]]]
      sub: |
        [[[
          const pos = entity?.state;
          const party = states['switch.driveway_gaterelaycontroller_gate_party_mode']?.state === 'on';
          if (party) return 'Hold-open requested · EXIT relay active';
          if (pos === 'Open') return 'At open limit · normal timer applies';
          if (pos === 'Closed') return 'Closed limit indicated · not independently verified';
          if (pos === 'Between Limits') return 'Position between limits (direction unknown)';
          return 'Check controller/limit signal availability';
        ]]]
    styles:
      card:
        - background: '#101d2d'
        - border: '1px solid #33465c'
        - border-radius: 20px
        - padding: 18px
      grid:
        - grid-template-areas: '"n" "gate" "l" "sub"'
        - grid-template-columns: 1fr
        - grid-template-rows: min-content 185px min-content min-content
      name:
        - color: '#f8fafc'
        - font-size: 22px
        - font-weight: 700
        - text-align: center
        - justify-self: center
        - padding-bottom: 8px
      label:
        - font-size: 16px
        - font-weight: 700
        - text-align: center
        - justify-self: center
        - color: |
            [[[
              const pos = entity?.state;
              const party = states['switch.driveway_gaterelaycontroller_gate_party_mode']?.state === 'on';
              return party ? '#fbbf24' : pos === 'Closed' ? '#4ade80' :
                pos === 'Open' ? '#60a5fa' : pos === 'Between Limits' ? '#fb923c' : '#94a3b8';
            ]]]
      custom_fields:
        gate:
          - width: 100%
          - height: 185px
          - display: flex
          - align-items: center
          - justify-content: center
        sub:
          - color: '#cbd5e1'
          - font-size: 12px
          - justify-self: center
          - text-align: center
          - padding-top: 6px

  # -------- Confirmation-gated OPEN and CLOSE controls --------
  - type: horizontal-stack
    cards:
      - type: custom:button-card
        entity: button.driveway_gaterelaycontroller_gate_open
        name: OPEN
        icon: mdi:gate-open
        show_label: true
        triggers_update:
          - sensor.driveway_gaterelaycontroller_gate_position
        label: |
          [[[
            const pos = states['sensor.driveway_gaterelaycontroller_gate_position']?.state;
            return pos === 'Open' ? 'Already open' :
              ['Closed','Between Limits'].includes(pos) ? 'Tap to open' : 'Unavailable';
          ]]]
        tap_action: |
          [[[
            const pos = states['sensor.driveway_gaterelaycontroller_gate_position']?.state;
            if (!['Closed','Between Limits'].includes(pos)) return {action: 'none'};
            return {
              action: 'call-service',
              service: 'button.press',
              target: {entity_id: 'button.driveway_gaterelaycontroller_gate_open'},
              confirmation: {text: 'Open the driveway gate? Confirm area is clear.'}
            };
          ]]]
        hold_action:
          action: none
        double_tap_action:
          action: none
        styles:
          card:
            - background: '#20483b'
            - border-radius: 14px
            - padding: 14px
            - opacity: |
                [[[
                  const p = states['sensor.driveway_gaterelaycontroller_gate_position']?.state;
                  return ['Closed','Between Limits'].includes(p) ? '1' : '0.35';
                ]]]
          icon:
            - color: '#4ade80'
            - width: 36px
          name:
            - color: '#ffffff'
            - font-size: 15px
          label:
            - color: '#cbd5e1'
            - font-size: 11px

      - type: custom:button-card
        entity: button.driveway_gaterelaycontroller_gate_close
        name: CLOSE
        icon: mdi:gate
        show_label: true
        triggers_update:
          - sensor.driveway_gaterelaycontroller_gate_position
        label: |
          [[[
            const pos = states['sensor.driveway_gaterelaycontroller_gate_position']?.state;
            return pos === 'Closed' ? 'Already closed' :
              ['Open','Between Limits'].includes(pos) ? 'Tap to close' : 'Unavailable';
          ]]]
        tap_action: |
          [[[
            const pos = states['sensor.driveway_gaterelaycontroller_gate_position']?.state;
            if (!['Open','Between Limits'].includes(pos)) return {action: 'none'};
            return {
              action: 'call-service',
              service: 'button.press',
              target: {entity_id: 'button.driveway_gaterelaycontroller_gate_close'},
              confirmation: {text: 'Close the driveway gate? Confirm area is clear.'}
            };
          ]]]
        hold_action:
          action: none
        double_tap_action:
          action: none
        styles:
          card:
            - background: '#35465b'
            - border-radius: 14px
            - padding: 14px
            - opacity: |
                [[[
                  const p = states['sensor.driveway_gaterelaycontroller_gate_position']?.state;
                  return ['Open','Between Limits'].includes(p) ? '1' : '0.35';
                ]]]
          icon:
            - color: '#93c5fd'
            - width: 36px
          name:
            - color: '#ffffff'
            - font-size: 15px
          label:
            - color: '#cbd5e1'
            - font-size: 11px

  # -------- Party Mode: may enable ONLY at Open limit --------
  - type: custom:button-card
    entity: switch.driveway_gaterelaycontroller_gate_party_mode
    name: PARTY MODE
    icon: mdi:party-popper
    show_state: false
    show_label: true
    triggers_update:
      - sensor.driveway_gaterelaycontroller_gate_position
      - switch.driveway_gaterelaycontroller_gate_party_mode
    label: |
      [[[
        const pos = states['sensor.driveway_gaterelaycontroller_gate_position']?.state;
        if (entity?.state === 'on') return 'ACTIVE · Tap to disable';
        return pos === 'Open' ? 'AVAILABLE · Tap to hold open' : 'UNAVAILABLE · Open gate fully first';
      ]]]
    tap_action: |
      [[[
        const pos = states['sensor.driveway_gaterelaycontroller_gate_position']?.state;
        const state = entity?.state;
        if (state === 'on') return {
          action: 'call-service', service: 'switch.turn_off',
          target: {entity_id: 'switch.driveway_gaterelaycontroller_gate_party_mode'}
        };
        if (state === 'off' && pos === 'Open') return {
          action: 'call-service', service: 'switch.turn_on',
          target: {entity_id: 'switch.driveway_gaterelaycontroller_gate_party_mode'}
        };
        return {action: 'none'};
      ]]]
    hold_action:
      action: none
    double_tap_action:
      action: none
    styles:
      card:
        - background: |
            [[[
              if (entity?.state === 'on') return '#62440e';
              return states['sensor.driveway_gaterelaycontroller_gate_position']?.state === 'Open'
                ? '#34465b' : '#222b38';
            ]]]
        - opacity: |
            [[[
              return entity?.state === 'on' ||
                states['sensor.driveway_gaterelaycontroller_gate_position']?.state === 'Open'
                ? '1' : '0.55';
            ]]]
        - border-radius: 14px
        - padding: 15px
      icon:
        - color: |
            [[[ return entity?.state === 'on' ? '#fbbf24' : '#d1d5db'; ]]]
        - width: 34px
      name:
        - color: '#ffffff'
        - font-size: 16px
        - font-weight: 700
      label:
        - color: '#cbd5e1'
        - font-size: 12px

  # -------- Optional Hue gate-post lights --------
  - type: horizontal-stack
    cards:
      - type: custom:button-card
        entity: light.hue_white_lamp_1_3
        name: LEFT LIGHT
        icon: mdi:outdoor-lamp
        show_state: false
        show_label: true
        label: |
          [[[
            return entity?.state === 'on' ? 'ON · Tap for OFF' :
              entity?.state === 'off' ? 'OFF · Tap for ON' : 'Unavailable';
          ]]]
        tap_action: |
          [[[
            return ['on','off'].includes(entity?.state) ? {action: 'toggle'} : {action: 'none'};
          ]]]
        hold_action:
          action: more-info
        double_tap_action:
          action: none
        styles:
          card:
            - background: |
                [[[ return entity?.state === 'on' ? '#51411f' : '#263447'; ]]]
            - border: '1px solid #34465b'
            - border-radius: 14px
            - padding: 14px
          icon:
            - color: |
                [[[ return entity?.state === 'on' ? '#ffda76' : '#94a3b8'; ]]]
            - width: 34px
          name:
            - color: '#ffffff'
            - font-size: 13px
          label:
            - color: '#cbd5e1'
            - font-size: 11px

      - type: custom:button-card
        entity: light.hue_white_lamp_1_2
        name: RIGHT LIGHT
        icon: mdi:outdoor-lamp
        show_state: false
        show_label: true
        label: |
          [[[
            return entity?.state === 'on' ? 'ON · Tap for OFF' :
              entity?.state === 'off' ? 'OFF · Tap for ON' : 'Unavailable';
          ]]]
        tap_action: |
          [[[
            return ['on','off'].includes(entity?.state) ? {action: 'toggle'} : {action: 'none'};
          ]]]
        hold_action:
          action: more-info
        double_tap_action:
          action: none
        styles:
          card:
            - background: |
                [[[ return entity?.state === 'on' ? '#51411f' : '#263447'; ]]]
            - border: '1px solid #34465b'
            - border-radius: 14px
            - padding: 14px
          icon:
            - color: |
                [[[ return entity?.state === 'on' ? '#ffda76' : '#94a3b8'; ]]]
            - width: 34px
          name:
            - color: '#ffffff'
            - font-size: 13px
          label:
            - color: '#cbd5e1'
            - font-size: 11px
